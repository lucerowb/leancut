# Builds the LeanCut desktop app for macOS (Apple Silicon) and Windows.
# Push a tag like v0.1.0 to also attach the builds to a GitHub Release.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # attach builds to the release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: dist/LeanCut-macOS.dmg
          - os: windows-latest
            artifact: dist/LeanCut-Windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-build.txt pytest
      - run: python -m pytest -q tests
      - run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: LeanCut-${{ runner.os }}
          path: ${{ matrix.artifact }}
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
