<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Stat card</title>
<script type="application/json" id="leancut-template">
{"name": "Stat card", "description": "The day in numbers: up to four stats that count up, written as \"142 km · 6 h · 2 punctures\".", "duration": 5,
 "fields": {"heading": {"label": "Heading", "default": "Day 3 in numbers"},
            "stats": {"label": "Stats, separated by ·", "default": "142 km · 6 h · 2 punctures"}}}
</script>
<style>
  html { font-size: calc(100vw / 192); }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body {
    --accent: #ff6a3d;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Nirmala UI", sans-serif;
    color: #fff; -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
  }
  #card {
    padding: 4.4rem 6.4rem 5rem; border-radius: 2.4rem; background: rgba(10, 12, 16, 0.64);
    box-shadow: 0 1.6rem 5rem rgba(0, 0, 0, 0.3); max-width: 168rem;
  }
  #heading { font-size: 2.8rem; font-weight: 750; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); text-align: center; }
  #stats { display: flex; justify-content: center; margin-top: 3.2rem; }
  .stat { padding: 0 5.6rem; text-align: center; }
  .stat + .stat { border-left: 0.2rem solid rgba(255, 255, 255, 0.18); }
  .num { font-size: 12rem; font-weight: 800; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .unit { margin-top: 1.4rem; font-size: 3rem; font-weight: 550; opacity: 0.82; white-space: nowrap; }
</style>
</head>
<body data-duration="{{duration}}">
<div id="card">
  <div id="heading">{{heading}}</div>
  <div id="stats" data-stats="{{stats}}"></div>
</div>
<script>
const D = Number(document.body.dataset.duration) || 5;
const clamp = (x) => Math.min(1, Math.max(0, x));
const span = (t, a, b) => clamp((t - a) / (b - a));
const outExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const inCubic = (x) => x * x * x;
const $ = (id) => document.getElementById(id);
const card = $('card'), heading = $('heading'), box = $('stats');
if (!heading.textContent.trim()) heading.style.display = 'none';

// "142 km · 6 h · 2 punctures" -> a number that counts up and its label, for each part (four at most)
const stats = box.dataset.stats.split(/\s*[·•|]\s*/).filter((s) => s.trim()).slice(0, 4).map((s) => {
  const m = s.trim().match(/^([+-]?\d[\d,]*(?:\.\d+)?)\s*(.*)$/);
  const el = document.createElement('div');
  el.className = 'stat';
  el.innerHTML = '<div class="num"></div><div class="unit"></div>';
  box.appendChild(el);
  const num = el.firstChild, unit = el.lastChild;
  if (!m) { num.textContent = s.trim(); return { el, num, unit, text: s.trim() }; }
  unit.textContent = m[2];
  num.textContent = m[1];
  num.style.minWidth = `${num.getBoundingClientRect().width}px`;
  const dec = m[1].includes('.') ? m[1].split('.')[1].length : 0;
  return { el, num, unit, value: Number(m[1].replace(/,/g, '')), dec, group: m[1].includes(',') };
});

window.film = {
  duration: D,
  frame(t) {
    const c = outExpo(span(t, 0, 0.7));
    const out = inCubic(span(t, D - 0.6, D));
    card.style.opacity = c * (1 - out);
    card.style.transform = `translateY(${(1 - c) * 3 - out * 2}rem) scale(${0.97 + 0.03 * c})`;
    heading.style.opacity = outExpo(span(t, 0.2, 0.9));
    heading.style.letterSpacing = `${0.22 + (1 - outExpo(span(t, 0.2, 1.1))) * 0.2}em`;
    stats.forEach((s, i) => {
      const a = 0.35 + i * 0.18;
      const e = outExpo(span(t, a, a + 0.7));
      s.el.style.opacity = e;
      s.el.style.transform = `translateY(${(1 - e) * 2.5}rem)`;
      if (s.value !== undefined) {
        const v = s.value * outExpo(span(t, a, a + 1.6));
        s.num.textContent = v.toLocaleString('en-US', { minimumFractionDigits: s.dec, maximumFractionDigits: s.dec, useGrouping: s.group });
      }
    });
  },
};

if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { window.film.frame(((performance.now() - t0) / 1000) % D); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
