<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Lower third</title>
<script type="application/json" id="leancut-template">
{"name": "Lower third", "description": "A name and a detail line that slide in at the bottom left.", "duration": 5,
 "fields": {"name": {"label": "Name", "default": "Srijan"},
            "detail": {"label": "Detail", "default": "Riding the Kali Gandaki valley"}}}
</script>
<style>
  html { font-size: calc(100vw / 192); }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body {
    --accent: #ff6a3d;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Nirmala UI", sans-serif;
    color: #fff; -webkit-font-smoothing: antialiased;
  }
  #box { position: absolute; left: 9.6rem; bottom: 12rem; display: flex; align-items: stretch; max-width: 110rem; }
  #bar { width: 0.8rem; background: var(--accent); border-radius: 0.4rem 0 0 0.4rem; transform-origin: bottom; }
  #plate {
    background: rgba(10, 12, 16, 0.66); padding: 2.2rem 4.4rem 2.6rem 3.2rem; border-radius: 0 0.6rem 0.6rem 0;
    box-shadow: 0 1.2rem 4rem rgba(0, 0, 0, 0.25);
  }
  #name { font-size: 5.8rem; font-weight: 750; letter-spacing: -0.01em; line-height: 1.1; }
  #detail { font-size: 3rem; font-weight: 500; line-height: 1.3; margin-top: 0.6rem; opacity: 0.86; }
</style>
</head>
<body data-duration="{{duration}}">
<div id="box">
  <div id="bar"></div>
  <div id="plate">
    <div id="name">{{name}}</div>
    <div id="detail">{{detail}}</div>
  </div>
</div>
<script>
const D = Number(document.body.dataset.duration) || 5;
const clamp = (x) => Math.min(1, Math.max(0, x));
const span = (t, a, b) => clamp((t - a) / (b - a));
const outExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const inCubic = (x) => x * x * x;
const inOutCubic = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const $ = (id) => document.getElementById(id);
const bar = $('bar'), plate = $('plate'), name = $('name'), detail = $('detail');
if (!detail.textContent.trim()) detail.style.display = 'none';

window.film = {
  duration: D,
  frame(t) {
    const out = span(t, D - 0.6, D);
    // in: the bar rises, the plate wipes open from it, the lines follow; out: the plate wipes back, the bar drops
    bar.style.transform = `scaleY(${outExpo(span(t, 0, 0.45)) * (1 - inCubic(span(t, D - 0.25, D)))})`;
    const open = outExpo(span(t, 0.2, 0.95)) * (1 - inOutCubic(span(t, D - 0.6, D - 0.15)));
    plate.style.clipPath = `inset(0 ${(1 - open) * 100}% 0 0)`;
    const n = outExpo(span(t, 0.35, 1.15)), d = outExpo(span(t, 0.5, 1.3));
    name.style.transform = `translateX(${(1 - n) * -3 - out * 2}rem)`;
    name.style.opacity = n;
    detail.style.transform = `translateX(${(1 - d) * -3 - out * 2}rem)`;
    detail.style.opacity = 0.86 * d;
  },
};

if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { window.film.frame(((performance.now() - t0) / 1000) % D); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
