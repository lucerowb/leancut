<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Title</title>
<script type="application/json" id="leancut-template">
{"name": "Title", "description": "A big title rising word by word, with a subtitle under an accent line.", "duration": 5,
 "fields": {"title": {"label": "Title", "default": "Annapurna Circuit"},
            "subtitle": {"label": "Subtitle", "default": "Day 3 · Manang to Thorong Phedi"}}}
</script>
<style>
  html { font-size: calc(100vw / 192); } /* 1rem = 10px on the 1920 × 1080 stage */
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body {
    --accent: #ff6a3d;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Nirmala UI", sans-serif;
    color: #fff; -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
  }
  .wrap { text-align: center; max-width: 160rem; }
  #title {
    margin: 0; font-size: 13rem; font-weight: 800; line-height: 1.04; letter-spacing: -0.025em;
    text-shadow: 0 0.4rem 3rem rgba(0, 0, 0, 0.35);
  }
  .mask { display: inline-block; overflow: hidden; vertical-align: top; padding: 0.12em 0.02em 0.1em; margin: -0.12em 0 -0.1em; }
  .mask > span { display: inline-block; will-change: transform; }
  #line { width: 14rem; height: 0.6rem; border-radius: 0.3rem; background: var(--accent); margin: 3.6rem auto 3rem; transform-origin: center; }
  #subtitle {
    margin: 0; font-size: 3.8rem; font-weight: 500; letter-spacing: 0.04em; opacity: 0.92;
    text-shadow: 0 0.2rem 1.6rem rgba(0, 0, 0, 0.45);
  }
</style>
</head>
<body data-duration="{{duration}}">
<div class="wrap" id="wrap">
  <h1 id="title">{{title}}</h1>
  <div id="line"></div>
  <p id="subtitle">{{subtitle}}</p>
</div>
<script>
const D = Number(document.body.dataset.duration) || 5;
const clamp = (x) => Math.min(1, Math.max(0, x));
const span = (t, a, b) => clamp((t - a) / (b - a));
const outExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const outCubic = (x) => 1 - Math.pow(1 - x, 3);
const inCubic = (x) => x * x * x;

// words in masks, made once at load: the picture still depends only on t
const title = document.getElementById('title');
const words = title.textContent.trim().split(/\s+/);
title.textContent = '';
const spans = words.map((w, i) => {
  const mask = document.createElement('span');
  mask.className = 'mask';
  const inner = document.createElement('span');
  inner.textContent = w;
  mask.appendChild(inner);
  title.appendChild(mask);
  if (i < words.length - 1) title.appendChild(document.createTextNode(' '));
  return inner;
});
const line = document.getElementById('line');
const subtitle = document.getElementById('subtitle');
const wrap = document.getElementById('wrap');
if (!subtitle.textContent.trim()) { subtitle.style.display = 'none'; line.style.display = 'none'; }

window.film = {
  duration: D,
  frame(t) {
    spans.forEach((s, i) => {
      const p = outExpo(span(t, 0.12 + i * 0.09, 1.1 + i * 0.09));
      s.style.transform = `translateY(${(1 - p) * 110}%)`;
    });
    line.style.transform = `scaleX(${outExpo(span(t, 0.45, 1.3))})`;
    const sp = outCubic(span(t, 0.7, 1.5));
    subtitle.style.opacity = 0.92 * sp;
    subtitle.style.transform = `translateY(${(1 - sp) * 2}rem)`;
    subtitle.style.letterSpacing = `${0.04 + (1 - sp) * 0.2}em`;
    const out = inCubic(span(t, D - 0.7, D));
    wrap.style.opacity = 1 - out;
    wrap.style.transform = `translateY(${-out * 3}rem)`;
    wrap.style.filter = out > 0 ? `blur(${out * 0.8}rem)` : 'none';
  },
};

if (!window.filmHost) { // opened on its own: play
  const t0 = performance.now();
  const loop = () => { window.film.frame(((performance.now() - t0) / 1000) % D); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
