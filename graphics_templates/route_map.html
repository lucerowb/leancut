<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Route map</title>
<script type="application/json" id="leancut-template">
{"name": "Route map", "description": "The GPS route drawn as a line (no map tiles, works offline), with a dot riding along it and the distance so far.", "duration": 10,
 "fields": {"title": {"label": "Title", "default": "Pokhara → Jomsom"},
            "data": {"label": "GPS: {\"t\": [s], \"lat\": [deg], \"lon\": [deg]}",
                     "default": {"t": [0, 0.9, 1.8, 2.7, 3.6, 4.5, 5.5, 6.4, 7.3, 8.2, 9.1, 10],
                                 "lat": [28.209, 28.262, 28.305, 28.357, 28.391, 28.452, 28.512, 28.556, 28.611, 28.664, 28.709, 28.781],
                                 "lon": [83.985, 83.912, 83.805, 83.741, 83.668, 83.641, 83.651, 83.623, 83.617, 83.633, 83.668, 83.723]}}}}
</script>
<script type="application/json" id="data">{{data}}</script>
<style>
  html { font-size: calc(100vw / 192); }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body {
    --accent: #ff6a3d;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Nirmala UI", sans-serif;
    color: #fff; -webkit-font-smoothing: antialiased;
  }
  #panel {
    position: absolute; right: 7rem; top: 7rem; width: 50rem; padding: 2.6rem 3rem 2.4rem; border-radius: 1.8rem;
    background: rgba(10, 12, 16, 0.62); box-shadow: 0 1.2rem 4rem rgba(0, 0, 0, 0.25);
  }
  #head { display: flex; align-items: baseline; justify-content: space-between; gap: 2rem; }
  #title { font-size: 3.2rem; font-weight: 750; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #km { font-size: 3.2rem; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
  #map { display: block; width: 100%; height: auto; margin-top: 1.6rem; overflow: visible; }
</style>
</head>
<body data-duration="{{duration}}">
<div id="panel">
  <div id="head"><div id="title">{{title}}</div><div id="km">0.0 km</div></div>
  <svg id="map" viewBox="0 0 440 320" aria-hidden="true">
    <polyline id="all" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline id="done" fill="none" stroke="#ff6a3d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle id="start" r="7" fill="rgba(10,12,16,0.9)" stroke="#fff" stroke-width="3"/>
    <rect id="end" width="13" height="13" rx="2" fill="#fff"/>
    <circle id="pulse" r="10" fill="none" stroke="#ff6a3d" stroke-width="3"/>
    <circle id="dot" r="10" fill="#fff" stroke="#ff6a3d" stroke-width="5"/>
  </svg>
</div>
<script>
const D = Number(document.body.dataset.duration) || 10;
const clamp = (x) => Math.min(1, Math.max(0, x));
const span = (t, a, b) => clamp((t - a) / (b - a));
const outExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const inCubic = (x) => x * x * x;
const $ = (id) => document.getElementById(id);
let data = {};
try { data = JSON.parse($('data').textContent); } catch (e) { data = {}; }
const n = Math.min(...['t', 'lat', 'lon'].map((k) => (Array.isArray(data[k]) ? data[k].length : 0)));
const T = [], LAT = [], LON = [];
for (let i = 0; i < n; i++) {
  const t = Number(data.t[i]), la = Number(data.lat[i]), lo = Number(data.lon[i]);
  if ([t, la, lo].every(Number.isFinite)) { T.push(t); LAT.push(la); LON.push(lo); }
}

// equirectangular projection around the route's middle latitude, fitted into the box with its proportions kept
const W = 440, H = 320, PAD = 24;
const mid = T.length ? (Math.min(...LAT) + Math.max(...LAT)) / 2 : 0;
const k = Math.cos(mid * Math.PI / 180);
const X = LON.map((lo) => lo * k), Y = LAT.map((la) => -la);
const [x0, x1, y0, y1] = [Math.min(...X), Math.max(...X), Math.min(...Y), Math.max(...Y)];
const s = Math.min((W - 2 * PAD) / ((x1 - x0) || 1e-9), (H - 2 * PAD) / ((y1 - y0) || 1e-9));
const px = X.map((x) => W / 2 + (x - (x0 + x1) / 2) * s), py = Y.map((y) => H / 2 + (y - (y0 + y1) / 2) * s);
const seg = px.slice(1).map((_, i) => Math.hypot(px[i + 1] - px[i], py[i + 1] - py[i]));
const cum = [0]; seg.forEach((l) => cum.push(cum[cum.length - 1] + l));
const total = cum[cum.length - 1] || 1;
// distance on the ground (haversine), cumulative
const R = 6371, rad = Math.PI / 180;
const hav = (i) => { const dLa = (LAT[i + 1] - LAT[i]) * rad, dLo = (LON[i + 1] - LON[i]) * rad;
  const a = Math.sin(dLa / 2) ** 2 + Math.cos(LAT[i] * rad) * Math.cos(LAT[i + 1] * rad) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a)); };
const km = [0]; for (let i = 0; i + 1 < T.length; i++) km.push(km[i] + hav(i));

const points = px.map((x, i) => `${x.toFixed(1)},${py[i].toFixed(1)}`).join(' ');
const all = $('all'), done = $('done'), dot = $('dot'), pulse = $('pulse'), panel = $('panel'), kmEl = $('km');
all.setAttribute('points', points);
done.setAttribute('points', points);
all.style.strokeDasharray = done.style.strokeDasharray = `${total} ${total + 1}`;
if (T.length) {
  $('start').setAttribute('cx', px[0]); $('start').setAttribute('cy', py[0]);
  $('end').setAttribute('x', px[px.length - 1] - 6.5); $('end').setAttribute('y', py[py.length - 1] - 6.5);
} else ['start', 'end', 'dot', 'pulse'].forEach((id) => { $(id).style.display = 'none'; });

// where the rider is at t: the segment and how far along it
const where = (t) => {
  if (T.length < 2) return { i: 0, f: 0 };
  if (t <= T[0]) return { i: 0, f: 0 };
  if (t >= T[T.length - 1]) return { i: T.length - 2, f: 1 };
  let lo = 0, hi = T.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (T[m] <= t) lo = m; else hi = m; }
  return { i: lo, f: (t - T[lo]) / ((T[hi] - T[lo]) || 1) };
};

window.film = {
  duration: D,
  frame(t) {
    const p = outExpo(span(t, 0, 0.7));
    const out = inCubic(span(t, D - 0.6, D));
    panel.style.opacity = p * (1 - out);
    panel.style.transform = `translateX(${(1 - p) * 3 + out * 2}rem)`;
    all.style.strokeDashoffset = total * (1 - outExpo(span(t, 0.2, 1.4)));
    if (!T.length) return;
    const { i, f } = where(t);
    const len = T.length > 1 ? cum[i] + seg[i] * f : 0;
    done.style.strokeDashoffset = total - len;
    const x = T.length > 1 ? px[i] + (px[i + 1] - px[i]) * f : px[0], y = T.length > 1 ? py[i] + (py[i + 1] - py[i]) * f : py[0];
    const show = outExpo(span(t, 0.5, 1.0));
    for (const c of [dot, pulse]) { c.setAttribute('cx', x); c.setAttribute('cy', y); }
    dot.setAttribute('r', 10 * show);
    const r = (((t % 1.4) + 1.4) % 1.4) / 1.4;
    pulse.setAttribute('r', 10 + r * 22);
    pulse.style.opacity = show * (1 - r);
    const dist = T.length > 1 ? km[i] + (km[i + 1] - km[i]) * f : 0;
    kmEl.textContent = `${dist.toFixed(dist < 100 ? 1 : 0)} km`;
  },
};

if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { window.film.frame(((performance.now() - t0) / 1000) % D); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
