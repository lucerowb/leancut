<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Chapter</title>
<script type="application/json" id="leancut-template">
{"name": "Chapter", "description": "A numbered chapter card: a large outlined number, a label and the chapter title.", "duration": 4,
 "fields": {"number": {"label": "Number", "default": "01"},
            "title": {"label": "Chapter title", "default": "Into the Mustang"},
            "label": {"label": "Label", "default": "Chapter"}}}
</script>
<style>
  html { font-size: calc(100vw / 192); }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body {
    --accent: #ff6a3d;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Nirmala UI", sans-serif;
    color: #fff; -webkit-font-smoothing: antialiased;
  }
  #card { position: absolute; left: 12rem; top: 50%; transform: translateY(-50%); display: flex; align-items: center; gap: 5rem; max-width: 168rem; }
  .mask { overflow: hidden; padding: 0.1em 0.04em; margin: -0.1em -0.04em; }
  #number {
    font-size: 26rem; font-weight: 800; line-height: 0.9; letter-spacing: -0.04em; font-variant-numeric: tabular-nums;
    color: transparent; -webkit-text-stroke: 0.3rem rgba(255, 255, 255, 0.95);
  }
  #rule { width: 0.4rem; align-self: stretch; background: var(--accent); border-radius: 0.2rem; transform-origin: top; }
  #label { font-size: 2.8rem; font-weight: 700; text-transform: uppercase; color: var(--accent); }
  #title {
    font-size: 9.6rem; font-weight: 800; line-height: 1.05; letter-spacing: -0.02em; margin-top: 1.4rem;
    text-shadow: 0 0.4rem 3rem rgba(0, 0, 0, 0.35);
  }
</style>
</head>
<body data-duration="{{duration}}">
<div id="card">
  <div class="mask"><div id="number">{{number}}</div></div>
  <div id="rule"></div>
  <div>
    <div class="mask"><div id="label">{{label}}</div></div>
    <div class="mask"><div id="title">{{title}}</div></div>
  </div>
</div>
<script>
const D = Number(document.body.dataset.duration) || 4;
const clamp = (x) => Math.min(1, Math.max(0, x));
const span = (t, a, b) => clamp((t - a) / (b - a));
const outExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const inCubic = (x) => x * x * x;
const $ = (id) => document.getElementById(id);
const card = $('card'), number = $('number'), rule = $('rule'), label = $('label'), title = $('title');

window.film = {
  duration: D,
  frame(t) {
    const n = outExpo(span(t, 0, 0.9));
    number.style.transform = `translateY(${(1 - n) * 100}%)`;
    rule.style.transform = `scaleY(${outExpo(span(t, 0.25, 0.95))})`;
    const l = outExpo(span(t, 0.4, 1.1));
    label.style.transform = `translateY(${(1 - l) * 100}%)`;
    label.style.letterSpacing = `${0.32 + (1 - l) * 0.3}em`;
    title.style.transform = `translateY(${(1 - outExpo(span(t, 0.5, 1.3))) * 105}%)`;
    const out = inCubic(span(t, D - 0.6, D));
    card.style.opacity = 1 - out;
    card.style.transform = `translate(${-out * 4}rem, -50%)`;
  },
};

if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { window.film.frame(((performance.now() - t0) / 1000) % D); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
