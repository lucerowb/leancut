<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>End screen</title>
<script type="application/json" id="leancut-template">
{"name": "End screen", "description": "A YouTube end screen: a heading, two video boxes and a subscribe circle, laid out where YouTube's end-screen elements go.", "duration": 12,
 "fields": {"heading": {"label": "Heading", "default": "Thanks for riding along"},
            "left_label": {"label": "Left box", "default": "Next ride"},
            "right_label": {"label": "Right box", "default": "Best of the trip"},
            "subscribe": {"label": "Subscribe label", "default": "Subscribe"}}}
</script>
<style>
  html { font-size: calc(100vw / 192); }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body {
    --accent: #ff6a3d;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Nirmala UI", sans-serif;
    color: #fff; -webkit-font-smoothing: antialiased;
  }
  #shade { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 55%, rgba(6, 8, 12, 0.55), rgba(6, 8, 12, 0.25) 70%, rgba(6, 8, 12, 0.1)); }
  #heading {
    position: absolute; left: 0; right: 0; top: 13rem; text-align: center; font-size: 6.4rem; font-weight: 800;
    letter-spacing: -0.015em; text-shadow: 0 0.3rem 2rem rgba(0, 0, 0, 0.4);
  }
  .box { position: absolute; top: 31rem; width: 60rem; height: 33.75rem; }
  #left { left: 33rem; }
  #right { left: 99rem; }
  .box svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .box .fill { fill: rgba(10, 12, 16, 0.35); }
  .box .edge { fill: none; stroke: #fff; stroke-width: 3; stroke-dasharray: 1 1; }
  .box .play { fill: rgba(255, 255, 255, 0.7); }
  .label {
    position: absolute; left: 0; top: -5rem; font-size: 2.6rem; font-weight: 700; letter-spacing: 0.16em;
    text-transform: uppercase; text-shadow: 0 0.2rem 1.2rem rgba(0, 0, 0, 0.5);
  }
  #sub { position: absolute; left: 50%; top: 72rem; width: 16rem; height: 16rem; margin-left: -8rem; }
  #sub svg { width: 100%; height: 100%; overflow: visible; }
  #sub circle { fill: rgba(10, 12, 16, 0.35); stroke: var(--accent); stroke-width: 5; stroke-dasharray: 1 1; }
  #sublabel {
    position: absolute; left: 50%; top: 91rem; transform: translateX(-50%); padding: 1rem 3rem; border-radius: 10rem;
    background: var(--accent); font-size: 2.8rem; font-weight: 750; white-space: nowrap;
  }
</style>
</head>
<body data-duration="{{duration}}">
<div id="shade"></div>
<div id="heading">{{heading}}</div>
<div class="box" id="left">
  <div class="label">{{left_label}}</div>
  <svg viewBox="0 0 600 337.5" preserveAspectRatio="none" aria-hidden="true">
    <rect class="fill" x="0" y="0" width="600" height="337.5" rx="14"/>
    <rect class="edge" x="0" y="0" width="600" height="337.5" rx="14" pathLength="1"/>
    <path class="play" d="M282 146v46l40-23z"/>
  </svg>
</div>
<div class="box" id="right">
  <div class="label">{{right_label}}</div>
  <svg viewBox="0 0 600 337.5" preserveAspectRatio="none" aria-hidden="true">
    <rect class="fill" x="0" y="0" width="600" height="337.5" rx="14"/>
    <rect class="edge" x="0" y="0" width="600" height="337.5" rx="14" pathLength="1"/>
    <path class="play" d="M282 146v46l40-23z"/>
  </svg>
</div>
<div id="sub"><svg viewBox="0 0 160 160" aria-hidden="true"><circle cx="80" cy="80" r="77" pathLength="1"/></svg></div>
<div id="sublabel">{{subscribe}}</div>
<script>
const D = Number(document.body.dataset.duration) || 12;
const clamp = (x) => Math.min(1, Math.max(0, x));
const span = (t, a, b) => clamp((t - a) / (b - a));
const outExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const outBack = (x) => 1 + 2.4 * Math.pow(x - 1, 3) + 1.4 * Math.pow(x - 1, 2);
const inCubic = (x) => x * x * x;
const $ = (id) => document.getElementById(id);
const all = [...document.body.children].filter((e) => e.tagName !== 'SCRIPT');
const shade = $('shade'), heading = $('heading'), sub = $('sub'), sublabel = $('sublabel');
const boxes = [$('left'), $('right')];

window.film = {
  duration: D,
  frame(t) {
    shade.style.opacity = outExpo(span(t, 0, 0.8));
    const h = outExpo(span(t, 0.1, 0.9));
    heading.style.opacity = h;
    heading.style.transform = `translateY(${(1 - h) * 2.5}rem)`;
    boxes.forEach((b, i) => {
      const p = outExpo(span(t, 0.35 + i * 0.15, 1.2 + i * 0.15));
      b.style.opacity = clamp(p * 1.5);
      b.style.transform = `scale(${0.94 + 0.06 * p})`;
      b.querySelector('.edge').style.strokeDashoffset = 1 - outExpo(span(t, 0.45 + i * 0.15, 1.6 + i * 0.15));
      b.querySelector('.label').style.opacity = outExpo(span(t, 0.9 + i * 0.15, 1.5 + i * 0.15));
    });
    const s = span(t, 0.8, 1.5);
    const beat = t > 2 ? Math.pow(Math.max(0, Math.sin((t - 2) * Math.PI / 1.5)), 8) * 0.05 : 0; // a soft pulse
    sub.style.transform = `scale(${0.6 + 0.4 * outBack(s) + beat})`;
    sub.style.opacity = clamp(s * 3);
    sub.querySelector('circle').style.strokeDashoffset = 1 - outExpo(span(t, 0.9, 1.9));
    const l = outExpo(span(t, 1.1, 1.8));
    sublabel.style.opacity = l;
    sublabel.style.transform = `translate(-50%, ${(1 - l) * 1.5}rem)`;
    const out = inCubic(span(t, D - 0.6, D));
    if (out > 0) all.forEach((e) => { e.style.opacity = Number(e.style.opacity || 1) * (1 - out); });
  },
};

if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { window.film.frame(((performance.now() - t0) / 1000) % D); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
