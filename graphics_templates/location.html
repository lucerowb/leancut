<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Location</title>
<script type="application/json" id="leancut-template">
{"name": "Location", "description": "A map pin drops in beside the place name, its region and an optional altitude that counts up.", "duration": 5,
 "fields": {"place": {"label": "Place", "default": "Muktinath"},
            "region": {"label": "Region", "default": "Mustang, Nepal"},
            "altitude": {"label": "Altitude (optional)", "default": "3,710 m"}}}
</script>
<style>
  html { font-size: calc(100vw / 192); }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body {
    --accent: #ff6a3d;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Nirmala UI", sans-serif;
    color: #fff; -webkit-font-smoothing: antialiased;
  }
  #tag { position: absolute; left: 9.6rem; top: 8.4rem; display: flex; align-items: flex-start; gap: 2.4rem; max-width: 120rem; }
  #pinbox { position: relative; width: 7.2rem; height: 10rem; flex: none; }
  #pin { position: absolute; left: 0; top: 0; width: 7.2rem; height: 9rem; filter: drop-shadow(0 0.6rem 1.2rem rgba(0, 0, 0, 0.35)); }
  #ring { position: absolute; left: 50%; top: 8.9rem; width: 6rem; height: 2rem; margin: -1rem 0 0 -3rem; border: 0.3rem solid var(--accent); border-radius: 50%; }
  #text { padding-top: 0.4rem; text-shadow: 0 0.3rem 2rem rgba(0, 0, 0, 0.45); }
  #place { font-size: 7rem; font-weight: 800; line-height: 1.05; letter-spacing: -0.015em; }
  #region { font-size: 2.6rem; font-weight: 650; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.88; margin-top: 1rem; }
  #alt {
    display: inline-flex; align-items: center; gap: 1rem; margin-top: 2rem; padding: 0.9rem 2rem 0.9rem 1.6rem;
    border-radius: 10rem; background: rgba(10, 12, 16, 0.55); font-size: 2.8rem; font-weight: 650;
    font-variant-numeric: tabular-nums; text-shadow: none;
  }
  #alt svg { width: 3rem; height: 2.2rem; }
</style>
</head>
<body data-duration="{{duration}}">
<div id="tag">
  <div id="pinbox">
    <div id="ring"></div>
    <svg id="pin" viewBox="0 0 72 90" aria-hidden="true">
      <path d="M36 2C18 2 4 15.6 4 33.2 4 56 36 88 36 88s32-32 32-54.8C68 15.6 54 2 36 2z" fill="#ff6a3d"/>
      <circle cx="36" cy="33" r="12" fill="#fff"/>
    </svg>
  </div>
  <div id="text">
    <div id="place">{{place}}</div>
    <div id="region">{{region}}</div>
    <div id="alt"><svg viewBox="0 0 30 22" aria-hidden="true"><path d="M1 21 11 5l5 8 3-4 10 12z" fill="#fff"/></svg><span id="altv" data-value="{{altitude}}"></span></div>
  </div>
</div>
<script>
const D = Number(document.body.dataset.duration) || 5;
const clamp = (x) => Math.min(1, Math.max(0, x));
const span = (t, a, b) => clamp((t - a) / (b - a));
const outExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const outBack = (x) => 1 + 2.4 * Math.pow(x - 1, 3) + 1.4 * Math.pow(x - 1, 2);
const inCubic = (x) => x * x * x;
const $ = (id) => document.getElementById(id);
const tag = $('tag'), pin = $('pin'), ring = $('ring'), place = $('place'), region = $('region'), alt = $('alt'), altv = $('altv');

// "3,710 m" counts up from 0 to 3,710 keeping its unit; text without a number just appears
const altText = altv.dataset.value.trim();
const m = altText.match(/^(.*?)(\d[\d,]*(?:\.\d+)?)(.*)$/);
const altTarget = m ? Number(m[2].replace(/,/g, '')) : null;
const decimals = m && m[2].includes('.') ? m[2].split('.')[1].length : 0;
const grouped = m ? m[2].includes(',') || altTarget >= 10000 : false;
const altAt = (p) => !m ? altText
  : m[1] + (altTarget * p).toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals, useGrouping: grouped }) + m[3];
if (!altText) alt.style.display = 'none';
if (!region.textContent.trim()) region.style.display = 'none';

window.film = {
  duration: D,
  frame(t) {
    const drop = span(t, 0, 0.75);
    pin.style.transform = `translateY(${(1 - outBack(drop)) * -6}rem)`;
    pin.style.opacity = clamp(drop * 4);
    const r = ((t - 0.6) % 1.6 + 1.6) % 1.6 / 1.6; // a ring pulses out from the pin's foot every 1.6 s
    ring.style.opacity = t < 0.6 ? 0 : 0.9 * (1 - r);
    ring.style.transform = `scale(${0.4 + r * 1.4})`;
    place.style.clipPath = `inset(-0.2em ${(1 - outExpo(span(t, 0.3, 1.1))) * 100}% -0.3em 0)`;
    const g = outExpo(span(t, 0.6, 1.4));
    region.style.opacity = 0.88 * g;
    region.style.transform = `translateY(${(1 - g) * 1.5}rem)`;
    const a = outExpo(span(t, 0.8, 1.6));
    alt.style.opacity = a;
    alt.style.transform = `translateY(${(1 - a) * 1.5}rem)`;
    altv.textContent = altAt(outExpo(span(t, 0.8, 2.2)));
    const out = inCubic(span(t, D - 0.6, D));
    tag.style.opacity = 1 - out;
    tag.style.transform = `translateY(${-out * 2}rem)`;
  },
};

if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { window.film.frame(((performance.now() - t0) / 1000) % D); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
